# Configurable debug output for the shapes behaviors.
# Change to "info", "warn", or "error" to suppress the per-node debug tracing.
org.slf4j.simpleLogger.defaultLogLevel = debug

# Send log output to stdout so sbt prefixes it with [info] instead of [error].
# (The default is System.err.)
org.slf4j.simpleLogger.logFile = System.out
